name: Offline workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Codex configuration, ledger and fake-host tests
        run: npm --prefix codex/plugin test
      - name: Claude detached-dispatch smoke checks
        shell: pwsh
        run: pwsh -NoProfile -File claude/tests/Smoke.ps1
